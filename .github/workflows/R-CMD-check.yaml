name: R CMD check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      live_yahoo:
        description: Also verify a live Yahoo history request
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Record validation environment
        run: |
          Rscript -e 'writeLines(capture.output(sessionInfo()), "session-info.txt"); write.table(installed.packages()[, c("Package", "Version")], "dependencies.tsv", sep="\t", quote=FALSE, row.names=FALSE)'
      - name: Build source package
        run: R CMD build --no-build-vignettes .
      - name: Check source package
        run: |
          archives=(FinCal_*.tar.gz)
          R CMD check --no-manual --no-vignettes "${archives[0]}"
          grep -Fq 'Status: OK' FinCal.Rcheck/00check.log
      - name: Verify live Yahoo request
        if: github.event_name == 'workflow_dispatch' && inputs.live_yahoo
        run: |
          Rscript -e 'library(FinCal, lib.loc="FinCal.Rcheck"); d <- get.ohlc.yahoo("AAPL", start=as.character(Sys.Date()-10), end=as.character(Sys.Date()-1)); stopifnot(nrow(d)>0, any(is.finite(d$close)), all(d$date >= as.character(Sys.Date()-10)), all(d$date <= as.character(Sys.Date()-1))); print(d)'
      - name: Upload package and validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r-package
          path: |
            FinCal_*.tar.gz
            FinCal.Rcheck/00check.log
            FinCal.Rcheck/00install.out
            FinCal.Rcheck/tests/*.Rout*
            session-info.txt
            dependencies.tsv
          retention-days: 30
